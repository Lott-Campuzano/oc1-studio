[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oc1studio"
version = "0.1.0"
description = "OC-1 STUDIO — estudio de música en la terminal (estética Teenage Engineering) con Strudel, sintetizador local e integración git."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["textual>=1.0"]

[project.scripts]
oc1studio = "oc1studio.cli:main"

[tool.setuptools]
packages = ["oc1studio"]
